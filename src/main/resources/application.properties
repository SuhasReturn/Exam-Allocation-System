spring.application.name=exam-allocation

# MySQL connection — change these to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/exam_allocation?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# "update" auto-creates and alters tables to match our entities — perfect for development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server port
server.port=8080

# JWT configuration
jwt.secret=ThisIsADevelopmentSecretKeyThatShouldBeAtLeast256BitsLongForHS256Algorithm
jwt.expiration-ms=86400000
