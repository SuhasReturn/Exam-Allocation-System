spring.application.name=exam-allocation

# Database settings (override through environment variables in deployment)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/exam_allocation?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server port
server.port=${PORT:8080}

# JWT configuration
jwt.secret=${JWT_SECRET:ThisIsADevelopmentSecretKeyThatShouldBeAtLeast256BitsLongForHS256Algorithm}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS origins/patterns (comma-separated)
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,https://*.vercel.app}
